<!DOCTYPE html>
<html>
  <head>
    <title>rock-paper-scissors</title>
    <link rel="stylesheet" href="./style.css" />
  </head>

  <body>
    <p style="font-size: 30px; font-weight: bold">Rock Paper Scissors</p>

    <button class="myPick-btn js-rock-btn">
      <img src="./images/rock-emoji.png" class="move-img" />
    </button>

    <button class="myPick-btn js-paper-btn">
      <img src="./images/paper-emoji.png" class="move-img" />
    </button>

    <button class="myPick-btn js-scissors-btn">
      <img src="./images/scissors-emoji.png" class="move-img" />
    </button>

    <p class="js-result result"></p>
    <p class="js-moves moves"></p>
    <p class="js-score" style="margin-top: 60px"></p>

    <button class="reset-btn js-reset-btn">Reset Score</button>

    <button class="autoplay-btn js-autoPlay-btn">Auto Play</button>
    <div class="js-resetConformation"></div>

    <script src="./script/script.js"></script>
  </body>
</html>
